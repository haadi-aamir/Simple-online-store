{% extends 'onlineStore/base.html' %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'onlineStore/css/auth.css' %}">
{% endblock %}

{% block body %}
    {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    
    <div class="auth-container">
        <h1 class="site-title"><span>M</span>y <span>O</span>nline <span>S</span>tore</h1>
        <div class="form-container" id="form_container">
            <h1 id="form-type">{% block form_type %}{% endblock %}</h1>
                {% block form %}
                {% endblock %}
        </div>
    </div>
{% endblock %}
